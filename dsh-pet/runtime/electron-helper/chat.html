<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>dsh-pet 聊天</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    display: flex; flex-direction: column;
    background: linear-gradient(180deg, #0e1621 0%, #101c2b 100%);
    color: #dce7f2; font: 14px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    user-select: none;
  }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px; border-bottom: 1px solid #1d2c3f; flex: 0 0 auto;
  }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #6fb7ff, #2b6cb0 70%);
    display: flex; align-items: center; justify-content: center; font-size: 18px;
    box-shadow: 0 0 0 2px #0e1621, 0 0 0 3px #2b6cb0;
  }
  header .who { flex: 1; }
  header .who .name { font-weight: 600; }
  header .who .sub { font-size: 11px; color: #7f95ad; }
  .tabs { display: flex; gap: 4px; margin-right: 6px; }
  .tab {
    padding: 5px 10px; font-size: 12px; border-radius: 999px;
    background: transparent; border: 1px solid #2a3d55; color: #8fa8c0;
  }
  .tab.active { background: #1f4d7a; border-color: #2b6cb0; color: #e8f2fc; }
  button {
    background: #1b2a3d; color: #bcd0e4; border: 1px solid #2a3d55; border-radius: 8px;
    padding: 5px 10px; font-size: 12px; cursor: pointer;
  }
  button:hover { background: #24374f; }
  button:disabled { opacity: .45; cursor: default; }
  #msgs { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .bubble {
    max-width: 78%; padding: 8px 12px; border-radius: 14px; white-space: pre-wrap;
    word-break: break-word; user-select: text; position: relative;
  }
  .row.assistant .bubble {
    background: #16283c; border: 1px solid #24405e; border-top-left-radius: 4px;
  }
  .row.user .bubble {
    background: #1f4d7a; border: 1px solid #2b6cb0; border-top-right-radius: 4px;
  }
  .bubble .speak {
    position: absolute; right: -28px; top: 4px; font-size: 12px; opacity: .55;
    cursor: pointer; padding: 2px;
  }
  .bubble .speak:hover { opacity: 1; }
  .bubble .meme { display: block; margin-top: 6px; font-size: 11px; color: #8fb4d9; }
  .bubble .meme::before { content: "🖼 "; }
  .sys { text-align: center; font-size: 11px; color: #64798e; padding: 2px; }
  footer {
    flex: 0 0 auto; display: flex; gap: 8px; padding: 10px 12px;
    border-top: 1px solid #1d2c3f;
  }
  #input {
    flex: 1; resize: none; height: 44px; max-height: 120px;
    background: #0d1826; color: #dce7f2; border: 1px solid #24374f; border-radius: 10px;
    padding: 9px 11px; font: inherit; outline: none;
  }
  #input:focus { border-color: #2b6cb0; }
  #send {
    align-self: flex-end; height: 44px; padding: 0 18px; border-radius: 10px;
    background: #1f4d7a; border-color: #2b6cb0; font-size: 13px;
  }
  #send:disabled { background: #1b2a3d; }
</style>
</head>
<body>
  <header>
    <div class="avatar">🐋</div>
    <div class="who">
      <div class="name" id="who">…</div>
      <div class="sub" id="sub">加载中</div>
    </div>
    <div class="tabs">
      <button class="tab active" data-pet="main">姐姐</button>
      <button class="tab" data-pet="maid-2">妹妹</button>
    </div>
    <button id="reload" title="重新拉取历史">刷新</button>
  </header>
  <div id="msgs"></div>
  <footer>
    <textarea id="input" placeholder="跟她说点什么… (Enter 发送, Shift+Enter 换行)" rows="2"></textarea>
    <button id="send">发送</button>
  </footer>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  let PET = q.get('pet') || 'main';
  const SURFACE = q.get('surface') || 'desktop';
  const BASE = q.get('base') || 'dsh-pet-bridge://dsh-pet/dsh-pet-7340';
  const $msgs = document.getElementById('msgs');
  const $input = document.getElementById('input');
  const $send = document.getElementById('send');
  const $who = document.getElementById('who');
  const $sub = document.getElementById('sub');

  async function api(path, opts) {
    const res = await fetch(BASE + path, opts);
    if (!res.ok) throw new Error('http ' + res.status);
    return res.json();
  }

  function bubble(role, text, meme) {
    const row = document.createElement('div');
    row.className = 'row ' + (role === 'user' ? 'user' : 'assistant');
    const b = document.createElement('div');
    b.className = 'bubble';
    b.textContent = text == null ? '' : String(text);
    if (meme) {
      const m = document.createElement('span');
      m.className = 'meme';
      m.textContent = String(meme);
      b.appendChild(m);
    }
    if (role !== 'user') {
      const s = document.createElement('span');
      s.className = 'speak';
      s.title = '念出来';
      s.textContent = '🔊';
      s.onclick = () => speak(b.textContent).catch((e) => sys('语音失败: ' + e.message));
      b.appendChild(s);
    }
    row.appendChild(b);
    $msgs.appendChild(row);
    $msgs.scrollTop = $msgs.scrollHeight;
  }

  function sys(text) {
    const d = document.createElement('div');
    d.className = 'sys';
    d.textContent = text;
    $msgs.appendChild(d);
    $msgs.scrollTop = $msgs.scrollHeight;
  }

  async function speak(text) {
    const res = await fetch(BASE + '/voice/speak', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: String(text).slice(0, 120) }),
    });
    const ct = res.headers.get('content-type') || '';
    if (!res.ok || ct.includes('json')) {
      let msg = 'speak failed';
      try { const d = await res.json(); if (d && d.reason) msg = d.reason; } catch (e) {}
      throw new Error(msg);
    }
    const buf = await res.arrayBuffer();
    const url = URL.createObjectURL(new Blob([buf], { type: 'audio/mpeg' }));
    const a = new Audio(url);
    a.onended = () => URL.revokeObjectURL(url);
    await a.play();
  }

  function normHistory(d) {
    const list = (d && (d.messages || d.history)) || [];
    return list.map((m) => ({
      role: m.role === 'user' || m.role === 'assistant' ? m.role : 'assistant',
      text: m.text != null ? m.text : (m.content != null ? m.content : ''),
    })).filter((m) => m.text);
  }

  async function loadHistory() {
    try {
      const d = await api('/chat?pet=' + encodeURIComponent(PET) + '&rounds=40');
      $msgs.innerHTML = '';
      const list = normHistory(d);
      if (!list.length) sys('还没有聊过,先跟她说句话吧');
      for (const m of list) bubble(m.role, m.text);
      $sub.textContent = '桌面直连 · ' + PET + (d && d.model ? '' : '');
    } catch (e) {
      sys('历史加载失败: ' + e.message);
    }
  }

  async function send() {
    const text = $input.value.trim();
    if (!text) return;
    $input.value = '';
    $send.disabled = true;
    bubble('user', text);
    try {
      const d = await api('/chat?pet=' + encodeURIComponent(PET) + '&surface=' + SURFACE, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text }),
      });
      if (d && d.ok === false) throw new Error(d.reason || 'chat failed');
      bubble('assistant', d.text || '……', d.image || null);
    } catch (e) {
      sys('发送失败: ' + e.message + '(服务在跑吗?用 dsh24 web 启动)');
    } finally {
      $send.disabled = false;
      $input.focus();
    }
  }

  $send.onclick = send;
  document.getElementById('reload').onclick = loadHistory;
  $input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });

  // 姐姐/妹妹页签:切换对话对象(历史分开存)
  document.querySelectorAll('.tab').forEach((tab) => {
    tab.onclick = () => {
      PET = tab.dataset.pet;
      document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('active', t === tab));
      updateWho();
      loadHistory();
    };
  });

  async function updateWho() {
    try {
      const d = await api('/config');
      const pets = (d && d.main && d.main.pets) || [];
      const p = pets.find((x) => x.id === PET);
      $who.textContent = (p && p.name) || PET;
      $sub.textContent = '桌面直连 · 随时聊';
    } catch (e) {
      $who.textContent = PET;
      $sub.textContent = '桌面直连';
    }
  }
  updateWho();
  loadHistory();
})();
</script>
</body>
</html>
